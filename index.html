<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文字雲編輯器</title>
  <style>
    :root{--ink:#243442;--muted:#6e7b83;--paper:#fffefa;--bg:#f7f4ed;--accent:#e86943;--line:#e5e0d7;--purple:#7054bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif}main{max-width:1240px;margin:auto;padding:0 4vw 48px}header{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);font-size:20px;font-weight:900}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:var(--accent);color:#fff;font:700 22px Georgia}.share{border:0;border-radius:12px;background:var(--purple);color:#fff;padding:11px 15px;font-weight:850;cursor:pointer}.intro{padding:31px 0 23px}.eyebrow{margin:0 0 9px;color:var(--accent);font-size:12px;letter-spacing:.16em;font-weight:900}.topic{display:flex;align-items:center;gap:12px;max-width:700px}.topic label{font-size:15px;font-weight:850;color:var(--muted);white-space:nowrap}.topic input{width:100%;border:1px solid #ded2bf;border-radius:10px;padding:12px 14px;background:var(--paper);font-size:18px;font-weight:700;outline:0}.intro>p:last-child{color:var(--muted);font-size:16px}.workspace{display:grid;grid-template-columns:minmax(320px,.76fr) minmax(440px,1.24fr);gap:22px}.panel{padding:25px;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 11px 28px #493c2610}.title{display:flex;justify-content:space-between;align-items:start}.step{margin:0 0 7px;color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:900}.title h2{margin:0;font-size:24px}.count{background:#f6efe6;border-radius:99px;padding:6px 10px;font-size:13px;color:#8a765f}.addbox{margin:22px 0 16px;padding:14px;background:#fbf5ea;border-radius:13px}.addbox label{display:block;font-size:14px;font-weight:850;margin-bottom:7px}textarea{width:100%;height:85px;padding:10px;resize:vertical;border:1px solid #e6dccc;border-radius:9px;font:inherit}button{cursor:pointer;font:inherit}.add{width:100%;margin-top:8px;padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:850}.list{max-height:380px;overflow:auto;border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 105px 32px 26px;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid #eee9e0}.row .word{border:0;background:transparent;font:700 16px inherit;min-width:0;outline:0}.row label{font-size:12px;color:var(--muted);white-space:nowrap}.row input[type=range]{width:66px;accent-color:var(--accent)}.row input[type=color]{border:0;background:none;width:31px;height:31px;padding:0}.x,.textbtn{border:0;background:none;color:#758188;padding:0}.x{font-size:22px}.foot{display:flex;justify-content:space-between;padding-top:17px}.danger{color:#c9574d}.preview{display:flex;flex-direction:column}.shape button{border:0;background:transparent;padding:7px 10px;color:#758188}.shape button.active{background:#f4eee5;border-radius:7px;color:var(--ink);font-weight:850}.cloud{height:490px;margin-top:20px;position:relative;overflow:hidden;background:#fdf9f0;border:1px dashed #ded2bf;border-radius:48% 52% 52% 48%/46% 45% 55% 54%}.cloud.square{border-radius:13px}.cloud span{position:absolute;white-space:nowrap;font-weight:850;line-height:1;transition:all .35s}.empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#9ba29d;line-height:1.7}.previewfoot{display:flex;justify-content:space-between;padding-top:17px;font-size:13px;color:#888}.shuffle{border:0;background:none;color:var(--accent);font-weight:850;padding:0}dialog{width:min(500px,calc(100% - 28px));border:0;border-radius:22px;padding:0;box-shadow:0 25px 80px #1f153d55}dialog::backdrop{background:#17203391;backdrop-filter:blur(3px)}.modal{padding:25px}.modal h2{margin:0 0 7px}.modal p{color:var(--muted);line-height:1.55}.qrbox{display:grid;place-items:center;min-height:260px;background:#fff;border:1px solid var(--line);border-radius:16px}.qrbox img{width:240px;height:240px}.urlrow{display:flex;gap:8px;margin-top:13px}.urlrow input{min-width:0;flex:1;padding:10px;border:1px solid var(--line);border-radius:9px}.urlrow button,.close{border:0;border-radius:9px;padding:10px 13px;font-weight:850}.urlrow button{background:var(--purple);color:#fff}.close{display:block;margin:13px 0 0 auto;background:#eeeae5}.notice{padding:10px 12px;background:#fff3d8;border-radius:10px;color:#8a5c00!important;font-size:14px}.hide{display:none}@media(max-width:800px){main{padding:0 16px 35px}.workspace{grid-template-columns:1fr}.cloud{height:400px}.list{max-height:280px}.topic{display:block}.topic label{display:block;margin-bottom:6px}.row{grid-template-columns:1fr 94px 30px 24px}}
  </style>
</head>
<body><main><header><div class="brand"><span class="mark">W</span>文字雲編輯器</div><button class="share" id="share">▦ 分享 QR Code</button></header>
  <section class="intro"><p class="eyebrow">CREATE・EDIT・SHARE</p><div class="topic"><label for="topic">文字雲主題</label><input id="topic" placeholder="例如：健康飲食、臺灣印象、班級腦力激盪"></div><p>輸入關鍵詞，自由調整大小與顏色。內容會自動儲存在目前裝置。</p></section>
  <div class="workspace"><aside class="panel"><div class="title"><div><p class="step">01／編輯內容</p><h2>關鍵詞清單</h2></div><span class="count" id="count"></span></div><div class="addbox"><label for="new">新增文字（可用換行、空格或逗號分隔）</label><textarea id="new" placeholder="營養、新鮮、有機食品、少糖、少油"></textarea><button class="add" id="add">＋ 加入文字雲</button></div><div class="list" id="list"></div><div class="foot"><button class="textbtn" id="reset">恢復範例</button><button class="textbtn danger" id="clear">清除全部</button></div></aside>
    <section class="panel preview"><div class="title"><div><p class="step">02／即時預覽</p><h2 id="previewTitle">我的文字雲</h2></div><div class="shape"><button class="active" id="round">圓形</button><button id="square">方形</button></div></div><div class="cloud" id="cloud"></div><div class="previewfoot"><button class="shuffle" id="shuffle">↻ 重新排列</button><span>變更會自動儲存</span></div></section></div>
</main>
<dialog id="qrDialog"><div class="modal"><h2>掃描 QR Code 開啟文字雲</h2><p>QR Code 內含目前的文字、大小、顏色及版型。另一台裝置掃描後可繼續編輯。</p><p class="notice hide" id="offlineNotice">目前是離線檔案。請先將 HTML 上傳到網站，再於下方貼上該網頁網址，才能讓其他裝置開啟。</p><div class="urlrow"><input id="shareBase" aria-label="公開網頁網址" placeholder="https://您的網站/文字雲編輯器.html"><button id="makeQr">產生</button></div><div class="qrbox" id="qrbox"><span>請輸入可公開開啟的網址</span></div><div class="urlrow"><input id="shareLink" readonly aria-label="分享連結"><button id="copy">複製連結</button></div><button class="close" id="close">關閉</button></div></dialog>
<script>
const palette=['#e4572e','#f3a712','#29335c','#1b998b','#c94c7d','#7851a9'],samples=['營養','健康','新鮮','蔬菜','水果','均衡飲食'];const $=s=>document.querySelector(s);let words=[],shape='round';
function encodeState(){const raw=JSON.stringify({topic:$('#topic').value,words,shape});const bytes=new TextEncoder().encode(raw);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}
function decodeState(value){try{let b64=value.replaceAll('-','+').replaceAll('_','/');while(b64.length%4)b64+='=';const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch{return null}}
function save(){localStorage.setItem('wordCloudTW',JSON.stringify({topic:$('#topic').value,words,shape}))}
function load(){const shared=location.hash.startsWith('#wc=')?decodeState(location.hash.slice(4)):null;let local=null;try{local=JSON.parse(localStorage.getItem('wordCloudTW'))}catch{}const d=shared||local;if(d?.words?.length){words=d.words;shape=d.shape||'round';$('#topic').value=d.topic||''}else words=samples.map((text,i)=>({text,size:5+i%5,color:palette[i]}))}
function safe(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){save();$('#count').textContent=`${words.length} 個詞`;$('#list').innerHTML='';words.forEach((x,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<input class="word" value="${safe(x.text)}"><label>大小 <input type="range" min="2" max="10" value="${x.size}"></label><input type="color" value="${x.color}" aria-label="文字顏色"><button class="x" aria-label="刪除">×</button>`;const [a,b,c,d]=row.children;a.oninput=e=>{x.text=e.target.value;renderCloud();save()};b.querySelector('input').oninput=e=>{x.size=+e.target.value;renderCloud();save()};c.oninput=e=>{x.color=e.target.value;renderCloud();save()};d.onclick=()=>{words.splice(i,1);render()};$('#list').append(row)});renderCloud()}
function renderCloud(){const cloud=$('#cloud');cloud.className=`cloud ${shape==='square'?'square':''}`;cloud.innerHTML='';$('#previewTitle').textContent=$('#topic').value||'我的文字雲';if(!words.length){cloud.innerHTML='<p class="empty">尚未加入文字<br>請從左側新增關鍵詞</p>';return}words.forEach((x,i)=>{const angle=i*2.39996,r=8+Math.sqrt(i+1)*18,span=document.createElement('span');span.textContent=x.text;span.style.cssText=`left:${50+Math.cos(angle)*r*.67}%;top:${50+Math.sin(angle)*r*.48}%;color:${x.color};font-size:${17+x.size*4}px;transform:translate(-50%,-50%) rotate(${(i*29)%32-16}deg)`;cloud.append(span)})}
$('#add').onclick=()=>{const list=$('#new').value.split(/[\s,，、]+/).filter(Boolean);words.push(...list.map((text,i)=>({text,size:5,color:palette[(words.length+i)%palette.length]})));$('#new').value='';render()};$('#reset').onclick=()=>{words=samples.map((text,i)=>({text,size:5+i%5,color:palette[i]}));render()};$('#clear').onclick=()=>{words=[];render()};$('#shuffle').onclick=()=>{words.sort(()=>Math.random()-.5);render()};function setShape(next){shape=next;$('#round').classList.toggle('active',next==='round');$('#square').classList.toggle('active',next==='square');render()}$('#round').onclick=()=>setShape('round');$('#square').onclick=()=>setShape('square');$('#topic').oninput=()=>{renderCloud();save()};
function shareUrl(){const base=$('#shareBase').value.trim();if(!/^https?:\/\//i.test(base))return null;return base.split('#')[0]+'#wc='+encodeState()}
function makeQr(){const url=shareUrl();if(!url){$('#qrbox').innerHTML='<span>請輸入以 https:// 或 http:// 開頭的公開網址</span>';return}$('#shareLink').value=url;const qr='https://quickchart.io/qr?size=500&margin=2&text='+encodeURIComponent(url);$('#qrbox').innerHTML=`<img src="${qr}" alt="文字雲分享 QR Code">`}
$('#share').onclick=()=>{const online=/^https?:$/i.test(location.protocol);$('#offlineNotice').classList.toggle('hide',online);$('#shareBase').value=online?location.href.split('#')[0]:localStorage.getItem('wordCloudPublicUrl')||'';$('#qrDialog').showModal();if(online)makeQr()};$('#makeQr').onclick=()=>{localStorage.setItem('wordCloudPublicUrl',$('#shareBase').value.trim());makeQr()};$('#copy').onclick=async()=>{if(!$('#shareLink').value)return;try{await navigator.clipboard.writeText($('#shareLink').value);$('#copy').textContent='已複製';setTimeout(()=>$('#copy').textContent='複製連結',1400)}catch{$('#shareLink').select();document.execCommand('copy')}};$('#close').onclick=()=>$('#qrDialog').close();$('#qrDialog').onclick=e=>{if(e.target===$('#qrDialog'))$('#qrDialog').close()};
load();setShape(shape);render();
</script></body></html>
