<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文字雲遊戲</title>
  <style>
    :root{--ink:#243442;--muted:#6e7b83;--paper:#fffefa;--bg:#f7f4ed;--accent:#e86943;--line:#e5e0d7;--purple:#7054bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif}main{max-width:1240px;margin:auto;padding:0 4vw 48px}header{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);font-size:20px;font-weight:900}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:var(--accent);color:#fff;font:700 22px Georgia}.share{border:0;border-radius:12px;background:var(--purple);color:#fff;padding:11px 15px;font-weight:850;cursor:pointer}.intro{padding:31px 0 23px}.eyebrow{margin:0 0 9px;color:var(--accent);font-size:12px;letter-spacing:.16em;font-weight:900}.topic{display:flex;align-items:center;gap:12px;max-width:700px}.topic label{font-size:15px;font-weight:850;color:var(--muted);white-space:nowrap}.topic input{width:100%;border:1px solid #ded2bf;border-radius:10px;padding:12px 14px;background:var(--paper);font-size:18px;font-weight:700;outline:0}.intro>p:last-child{color:var(--muted);font-size:16px}.workspace{display:grid;grid-template-columns:minmax(0,.76fr) minmax(0,1.24fr);gap:22px}.panel{min-width:0;padding:25px;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 11px 28px #493c2610}.title{display:flex;justify-content:space-between;align-items:start}.step{margin:0 0 7px;color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:900}.title h2{margin:0;font-size:24px}.count{background:#f6efe6;border-radius:99px;padding:6px 10px;font-size:13px;color:#8a765f}.addbox{margin:22px 0 16px;padding:14px;background:#fbf5ea;border-radius:13px}.addbox label{display:block;font-size:14px;font-weight:850;margin-bottom:7px}textarea{width:100%;height:85px;padding:10px;resize:vertical;border:1px solid #e6dccc;border-radius:9px;font:inherit}button{cursor:pointer;font:inherit}.add{width:100%;margin-top:8px;padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:850}.list{max-height:380px;overflow:auto;border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 105px 32px 26px;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid #eee9e0}.row .word{border:0;background:transparent;font:700 16px inherit;min-width:0;outline:0}.row label{font-size:12px;color:var(--muted);white-space:nowrap}.row input[type=range]{width:66px;accent-color:var(--accent)}.row input[type=color]{border:0;background:none;width:31px;height:31px;padding:0}.x,.textbtn{border:0;background:none;color:#758188;padding:0}.x{font-size:22px}.foot{display:flex;justify-content:space-between;padding-top:17px}.danger{color:#c9574d}.preview{display:flex;flex-direction:column}.shape button{border:0;background:transparent;padding:7px 10px;color:#758188}.shape button.active{background:#f4eee5;border-radius:7px;color:var(--ink);font-weight:850}.cloud{height:490px;margin-top:20px;position:relative;overflow:hidden;background:#fdf9f0;border:1px dashed #ded2bf;border-radius:48% 52% 52% 48%/46% 45% 55% 54%}.cloud.square{border-radius:13px}.cloud span{position:absolute;white-space:nowrap;font-weight:850;line-height:1;transition:all .35s}.empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#9ba29d;line-height:1.7}.previewfoot{display:flex;justify-content:space-between;padding-top:17px;font-size:13px;color:#888}.shuffle{border:0;background:none;color:var(--accent);font-weight:850;padding:0}dialog{width:min(500px,calc(100% - 28px));border:0;border-radius:22px;padding:0;box-shadow:0 25px 80px #1f153d55}dialog::backdrop{background:#17203391;backdrop-filter:blur(3px)}.modal{padding:25px}.modal h2{margin:0 0 7px}.modal p{color:var(--muted);line-height:1.55}.qrbox{display:grid;place-items:center;min-height:260px;background:#fff;border:1px solid var(--line);border-radius:16px}.qrbox img{width:240px;height:240px}.urlrow{display:flex;gap:8px;margin-top:13px}.urlrow input{min-width:0;flex:1;padding:10px;border:1px solid var(--line);border-radius:9px}.urlrow button,.close{border:0;border-radius:9px;padding:10px 13px;font-weight:850}.urlrow button{background:var(--purple);color:#fff}.close{display:block;margin:13px 0 0 auto;background:#eeeae5}.notice{padding:10px 12px;background:#fff3d8;border-radius:10px;color:#8a5c00!important;font-size:14px}.hide{display:none}@media(max-width:800px){main{padding:0 16px 35px}.workspace{grid-template-columns:1fr}.cloud{height:400px}.list{max-height:280px}.topic{display:block}.topic label{display:block;margin-bottom:6px}.row{grid-template-columns:1fr 94px 30px 24px}}
  .header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.edit-toggle{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;color:var(--muted);font-size:14px}body:not(.editing) .editor-only{display:none!important}body:not(.editing) .workspace{grid-template-columns:1fr;margin-top:24px}body:not(.editing) .cloud{height:clamp(380px,70vh,740px)}body:not(.editing) .preview{max-width:1100px;width:100%;margin:auto}@media(max-width:600px){header{flex-wrap:wrap;padding:15px 0}.header-actions{width:100%;justify-content:space-between}body:not(.editing) .cloud{height:65vh;min-height:350px}}</style>
</head>
<body><main><header><div class="brand"><span class="mark">W</span>文字雲遊戲</div><div class="header-actions"><button class="edit-toggle" id="editMode">課前編輯</button><button class="share" id="share">▦ 分享 QR Code</button></div></header>
  <section class="intro editor-only"><p class="eyebrow">CREATE・EDIT・SHARE</p><div class="topic"><label for="topic">文字雲主題</label><input id="topic" placeholder="例如：健康飲食、臺灣印象、班級腦力激盪"></div><p>輸入關鍵詞，自由調整大小與顏色。內容會自動儲存在此瀏覽器，下次開啟即可使用。換裝置請使用編輯完成後的分享連結或 QR Code。</p></section>
  <div class="workspace"><aside class="panel editor-only"><div class="title"><div><p class="step">01／編輯內容</p><h2>關鍵詞清單</h2></div><span class="count" id="count"></span></div><div class="addbox"><label for="new">新增文字（可用換行、空格或逗號分隔）</label><textarea id="new" placeholder="營養、新鮮、有機食品、少糖、少油"></textarea><button class="add" id="add">＋ 加入文字雲</button></div><button class="add" id="saveAndPlay">儲存並開始</button><div class="list" id="list"></div><div class="foot"><button class="textbtn" id="reset">恢復範例</button><button class="textbtn danger" id="clear">清除全部</button></div></aside>
    <section class="panel preview"><div class="title"><div><p class="step editor-only">文字雲預覽</p><h2 id="previewTitle">我的文字雲</h2></div><div class="shape editor-only"><button class="active" id="round">圓形</button><button id="square">方形</button></div></div><div class="cloud" id="cloud"></div><div class="previewfoot"><button class="shuffle" id="shuffle">↻ 重新排列</button><span id="saveStatus" class="editor-only" role="status"></span></div></section></div>
</main>
<dialog id="qrDialog"><div class="modal"><h2>掃描 QR Code 開啟文字雲</h2><p>QR Code 內含目前的文字、大小、顏色及版型。另一台裝置掃描後直接顯示文字雲。重新編輯後，請產生新的分享連結或 QR Code。</p><p class="notice hide" id="offlineNotice">目前是離線檔案。請先將 HTML 上傳到網站，再於下方貼上該網頁網址，才能讓其他裝置開啟。</p><div class="urlrow"><input id="shareBase" aria-label="公開網頁網址" placeholder="https://您的網站/文字雲編輯器.html"><button id="makeQr">產生</button></div><div class="qrbox" id="qrbox"><span>請輸入可公開開啟的網址</span></div><div class="urlrow"><input id="shareLink" readonly aria-label="分享連結"><button id="copy">複製連結</button></div><button class="close" id="close">關閉</button></div></dialog>
<script>
const palette=['#e4572e','#f3a712','#29335c','#1b998b','#c94c7d','#7851a9'],samples=['營養','健康','新鮮','蔬菜','水果','均衡飲食'];const $=s=>document.querySelector(s);let words=[],shape='round';
function encodeState(){const raw=JSON.stringify({topic:$('#topic').value,words,shape});const bytes=new TextEncoder().encode(raw);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}
function decodeState(value){try{let b64=value.replaceAll('-','+').replaceAll('_','/');while(b64.length%4)b64+='=';const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch{return null}}
const sourceHash=location.hash.startsWith('#wc=')?location.hash:'';
function validState(d){return d&&Array.isArray(d.words)&&d.words.length<=300&&d.words.every(w=>typeof w.text==='string'&&w.text.length<=100&&Number.isFinite(Number(w.size))&&/^#[0-9a-f]{6}$/i.test(w.color))&&(!d.topic||typeof d.topic==='string')&&(!d.shape||['round','square'].includes(d.shape))}
function save(){try{localStorage.setItem('wordCloudTW',JSON.stringify({topic:$('#topic').value,words,shape,sourceHash}));$('#saveStatus').textContent='已儲存至此瀏覽器';return true}catch{$('#saveStatus').textContent='無法儲存，請先用分享連結備份內容。';return false}}
function load(){const shared=sourceHash?decodeState(sourceHash.slice(4)):null;let local=null;try{local=JSON.parse(localStorage.getItem('wordCloudTW'))}catch{}
const localOK=validState(local),sharedOK=validState(shared);const d=sharedOK?((localOK&&local.sourceHash===sourceHash)?local:shared):(localOK?local:null);
if(d){words=d.words;shape=d.shape||'round';$('#topic').value=d.topic||''}else words=samples.map((text,i)=>({text,size:5+i%5,color:palette[i]}))}
function safe(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML.replaceAll('"','&quot;')}
function render(){save();$('#count').textContent=`${words.length} 個詞`;$('#list').innerHTML='';words.forEach((x,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<input class="word" value="${safe(x.text)}"><label>大小 <input type="range" min="2" max="10" value="${x.size}"></label><input type="color" value="${x.color}" aria-label="文字顏色"><button class="x" aria-label="刪除">×</button>`;const [a,b,c,d]=row.children;a.oninput=e=>{x.text=e.target.value;renderCloud();save()};b.querySelector('input').oninput=e=>{x.size=+e.target.value;renderCloud();save()};c.oninput=e=>{x.color=e.target.value;renderCloud();save()};d.onclick=()=>{words.splice(i,1);render()};$('#list').append(row)});renderCloud()}
function renderCloud(){const cloud=$('#cloud');cloud.className=`cloud ${shape==='square'?'square':''}`;cloud.innerHTML='';$('#previewTitle').textContent=$('#topic').value||'我的文字雲';if(!words.length){cloud.innerHTML='<p class="empty">尚未加入文字<br>請按「課前編輯」準備內容</p>';return}words.forEach((x,i)=>{const angle=i*2.39996,r=8+Math.sqrt(i+1)*18,span=document.createElement('span');span.textContent=x.text;span.style.cssText=`left:${50+Math.cos(angle)*r*.67}%;top:${50+Math.sin(angle)*r*.48}%;color:${x.color};font-size:${17+x.size*4}px;transform:translate(-50%,-50%) rotate(${(i*29)%32-16}deg)`;cloud.append(span)})}
$('#add').onclick=()=>{const list=$('#new').value.split(/[\s,，、]+/).filter(Boolean);words.push(...list.map((text,i)=>({text,size:5,color:palette[(words.length+i)%palette.length]})));$('#new').value='';render()};$('#reset').onclick=()=>{words=samples.map((text,i)=>({text,size:5+i%5,color:palette[i]}));render()};$('#clear').onclick=()=>{words=[];render()};$('#shuffle').onclick=()=>{words.sort(()=>Math.random()-.5);render()};function setShape(next){shape=next;$('#round').classList.toggle('active',next==='round');$('#square').classList.toggle('active',next==='square');render()}$('#round').onclick=()=>setShape('round');$('#square').onclick=()=>setShape('square');$('#topic').oninput=()=>{renderCloud();save()};
function shareUrl(){const base=$('#shareBase').value.trim();if(!/^https?:\/\//i.test(base))return null;const url=new URL(base);url.hash='';url.searchParams.delete('edit');return url.href+'#wc='+encodeState()}
function makeQr(){const url=shareUrl();if(!url){$('#qrbox').innerHTML='<span>請輸入以 https:// 或 http:// 開頭的公開網址</span>';return}$('#shareLink').value=url;const qr='https://quickchart.io/qr?size=500&margin=2&text='+encodeURIComponent(url);$('#qrbox').innerHTML=`<img src="${qr}" alt="文字雲分享 QR Code">`}
$('#share').onclick=()=>{const online=/^https?:$/i.test(location.protocol);$('#offlineNotice').classList.toggle('hide',online);$('#shareBase').value=online?location.href.split('#')[0]:localStorage.getItem('wordCloudPublicUrl')||'';$('#qrDialog').showModal();if(online)makeQr()};$('#makeQr').onclick=()=>{localStorage.setItem('wordCloudPublicUrl',$('#shareBase').value.trim());makeQr()};$('#copy').onclick=async()=>{if(!$('#shareLink').value)return;try{await navigator.clipboard.writeText($('#shareLink').value);$('#copy').textContent='已複製';setTimeout(()=>$('#copy').textContent='複製連結',1400)}catch{$('#shareLink').select();document.execCommand('copy')}};$('#close').onclick=()=>$('#qrDialog').close();$('#qrDialog').onclick=e=>{if(e.target===$('#qrDialog'))$('#qrDialog').close()};
function setEditMode(editing){document.body.classList.toggle('editing',editing);$('#editMode').textContent=editing?'返回遊戲':'課前編輯';const url=new URL(location.href);if(editing)url.searchParams.set('edit','1');else url.searchParams.delete('edit');history.replaceState(null,'',url);requestAnimationFrame(()=>renderCloud())}
$('#editMode').onclick=()=>{if(document.body.classList.contains('editing')){if(save())setEditMode(false)}else setEditMode(true)};
$('#saveAndPlay').onclick=()=>{if(save()){setEditMode(false);window.scrollTo({top:0,behavior:'smooth'})}};
load();setEditMode(new URLSearchParams(location.search).get('edit')==='1');setShape(shape);render();
</script><script>
// Seeded scatter keeps edits stable; shuffle chooses a new arrangement.
let cloudSeed = Math.floor(Math.random() * 4294967296);
function fitCloud(items, width, height, shape, seed = 1) {
  function random() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }
  const measured = items.map((item, index) => {
    const angle = (random() < .5 ? -1 : 1) * (8 + random() * 16), radians = angle * Math.PI / 180;
    return { ...item, index, angle, offset: random(),
      bw: Math.abs(item.width * Math.cos(radians)) + Math.abs(item.height * Math.sin(radians)),
      bh: Math.abs(item.width * Math.sin(radians)) + Math.abs(item.height * Math.cos(radians)) };
  }).sort((a, b) => b.bw * b.bh - a.bw * a.bh);
  const phase = random() * Math.PI * 2;
  const candidates = Math.max(1200, items.length * 8);
  // Inset also protects the original, slightly asymmetric rounded border.
  const rx = width * .43, ry = height * .43;
  function inside(x, y, hw, hh) {
    if (shape === 'square') { const pad = Math.min(16, width * .1, height * .1); return x - hw >= pad && x + hw <= width - pad && y - hh >= pad && y + hh <= height - pad; }
    return ((Math.abs(x - width / 2) + hw) / rx) ** 2 + ((Math.abs(y - height / 2) + hh) / ry) ** 2 <= 1;
  }
  for (let scale = 1; ; scale *= .8) {
    const placed = [];
    for (const item of measured) {
      const hw = item.bw * scale / 2, hh = item.bh * scale / 2, gap = 5 * scale;
      let found = false;
      for (let k = 0; k < candidates; k++) {
        const slot = (k + Math.floor(item.offset * candidates)) % candidates;
        const angle = phase + slot * 2.399963229728653;
        const radius = Math.sqrt((slot + .5) / candidates);
        const x = width / 2 + Math.cos(angle) * radius * rx;
        const y = height / 2 + Math.sin(angle) * radius * ry;
        if (!inside(x, y, hw + gap, hh + gap)) continue;
        if (placed.some(p => Math.abs(p.x - x) < p.hw + hw + gap && Math.abs(p.y - y) < p.hh + hh + gap)) continue;
        placed.push({ ...item, x, y, hw, hh, scale }); found = true; break;
      }
      if (!found) break;
    }
    if (placed.length === items.length) return placed;
  }
}
renderCloud = function () {
  const cloud = $('#cloud'); cloud.className = `cloud ${shape === 'square' ? 'square' : ''}`;
  cloud.innerHTML = ''; $('#previewTitle').textContent = $('#topic').value || '我的文字雲';
  if (!words.length) { cloud.innerHTML = '<p class="empty">尚未加入文字<br>請按「課前編輯」準備內容</p>'; return; }
  const width = cloud.clientWidth, height = cloud.clientHeight;
  if (!width || !height) return;
  const items = words.map(word => {
    const span = document.createElement('span'); span.textContent = word.text;
    Object.assign(span.style, { color: word.color, fontSize: `${17 + Math.max(2, Math.min(10, Number(word.size) || 5)) * 4}px`,
      lineHeight: '1.25', padding: '2px', transition: 'none', transformOrigin: 'center center' });
    cloud.append(span); const rect = span.getBoundingClientRect();
    return { span, width: rect.width, height: rect.height };
  });
  const layout = fitCloud(items, width, height, shape, cloudSeed);
  for (const item of layout) Object.assign(item.span.style, {
    left: item.x + 'px', top: item.y + 'px',
    transform: 'translate(-50%, -50%) rotate(' + item.angle + 'deg) scale(' + item.scale + ')'
  });
};
let cloudFrame;
function scheduleCloud() { cancelAnimationFrame(cloudFrame); cloudFrame = requestAnimationFrame(renderCloud); }
new ResizeObserver(scheduleCloud).observe($('#cloud'));
document.fonts.ready.then(scheduleCloud);
renderCloud();

$('#shuffle').addEventListener('click', () => { cloudSeed = Math.floor(Math.random() * 4294967296); renderCloud(); });

</script></body></html>
